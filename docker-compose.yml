services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override at build time: docker compose build --build-arg NEXT_PUBLIC_API_URL=http://your-backend/
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.20.160:8090/}
    image: kenya-ppe:latest
    container_name: kenya-ppe-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: kenya-ppe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
