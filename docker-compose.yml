services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    image: kenya-ppe:latest
    container_name: kenya-ppe-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Override at runtime: set NEXT_PUBLIC_API_URL in your shell or .env file
      # Default is the Cloudflare tunnel URL baked into the image
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://deal-believed-reforms-employ.trycloudflare.com}
    expose:
      - "3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: kenya-ppe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
